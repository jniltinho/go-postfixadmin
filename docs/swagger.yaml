basePath: /api/v1
definitions:
  dto.APIError:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  dto.APIResponse:
    properties:
      data: {}
      error:
        $ref: '#/definitions/dto.APIError'
      success:
        type: boolean
    type: object
  dto.AdminDetailResponse:
    properties:
      admin:
        $ref: '#/definitions/dto.AdminResponse'
      domains:
        items:
          $ref: '#/definitions/dto.AdminDomainOption'
        type: array
    type: object
  dto.AdminDomainOption:
    properties:
      assigned:
        example: true
        type: boolean
      domain:
        example: example.com
        type: string
    type: object
  dto.AdminResponse:
    properties:
      active:
        example: true
        type: boolean
      created:
        type: string
      domain_count:
        description: '"ALL" for superadmins'
        example: "3"
        type: string
      modified:
        type: string
      superadmin:
        example: false
        type: boolean
      username:
        example: admin@example.com
        type: string
    type: object
  dto.AliasDomainResponse:
    properties:
      active:
        example: true
        type: boolean
      alias_domain:
        example: alias.com
        type: string
      created:
        type: string
      modified:
        type: string
      target_domain:
        example: example.com
        type: string
    type: object
  dto.AliasResponse:
    properties:
      active:
        example: true
        type: boolean
      address:
        example: info@example.com
        type: string
      created:
        type: string
      domain:
        example: example.com
        type: string
      goto:
        example: admin@example.com,backup@example.com
        type: string
      modified:
        type: string
    type: object
  dto.AssignRoleRequest:
    properties:
      domain:
        type: string
      role_id:
        type: integer
    type: object
  dto.CreateAdminRequest:
    properties:
      active:
        example: true
        type: boolean
      domains:
        items:
          type: string
        type: array
      password:
        example: SecurePass1!
        type: string
      superadmin:
        example: false
        type: boolean
      username:
        example: admin@example.com
        type: string
    type: object
  dto.CreateAliasDomainRequest:
    properties:
      active:
        example: true
        type: boolean
      alias_domain:
        example: alias.com
        type: string
      target_domain:
        example: example.com
        type: string
    type: object
  dto.CreateAliasRequest:
    properties:
      active:
        example: true
        type: boolean
      domain:
        example: example.com
        type: string
      goto:
        example: |-
          admin@example.com
          backup@example.com
        type: string
      local_part:
        example: info
        type: string
    type: object
  dto.CreateDomainRequest:
    properties:
      active:
        type: boolean
      aliases:
        type: integer
      backupmx:
        type: boolean
      description:
        type: string
      domain:
        type: string
      mailboxes:
        type: integer
      password_expiry:
        type: integer
      quota:
        type: integer
      transport:
        type: string
    type: object
  dto.CreateMailboxRequest:
    properties:
      active:
        type: boolean
      domain:
        type: string
      email_other:
        type: string
      local_part:
        type: string
      name:
        type: string
      password:
        type: string
      quota:
        type: integer
      send_welcome:
        type: boolean
      smtp_active:
        type: boolean
    type: object
  dto.CreateRoleRequest:
    properties:
      description:
        type: string
      name:
        type: string
      permission_ids:
        items:
          type: integer
        type: array
    type: object
  dto.CreateTransportRequest:
    properties:
      active:
        example: true
        type: boolean
      domain:
        example: example.com
        type: string
      transport:
        example: smtp:[relay.example.com]:25
        type: string
    type: object
  dto.DashboardStatsResponse:
    properties:
      aliases:
        type: integer
      domains:
        type: integer
      mailboxes:
        type: integer
      recent_logs:
        items:
          $ref: '#/definitions/dto.LogEntryResponse'
        type: array
    type: object
  dto.DomainResponse:
    properties:
      active:
        type: boolean
      alias_count:
        description: Optional enrichment
        type: integer
      aliases:
        type: integer
      backupmx:
        type: boolean
      created:
        type: string
      description:
        type: string
      domain:
        type: string
      mailbox_count:
        type: integer
      mailboxes:
        type: integer
      maxquota:
        type: integer
      modified:
        type: string
      password_expiry:
        type: integer
      quota:
        type: integer
      transport:
        type: string
    type: object
  dto.LogEntryResponse:
    properties:
      action:
        type: string
      data:
        type: string
      domain:
        type: string
      timestamp:
        type: string
      username:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  dto.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      token_type:
        type: string
      user:
        $ref: '#/definitions/dto.UserInfo'
    type: object
  dto.MailLogEntryResponse:
    properties:
      domain_from:
        type: string
      domain_to:
        type: string
      helo:
        type: string
      host_ip:
        type: string
      host_name:
        type: string
      logdate:
        type: string
      m_from:
        type: string
      m_to:
        type: string
      msgsize:
        type: integer
    type: object
  dto.MailboxResponse:
    properties:
      active:
        type: boolean
      created:
        type: string
      domain:
        type: string
      email_other:
        type: string
      modified:
        type: string
      name:
        type: string
      password_expiry:
        type: string
      quota:
        type: integer
      smtp_active:
        type: boolean
      username:
        type: string
    type: object
  dto.PaginatedLogResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.LogEntryResponse'
        type: array
      filtered:
        example: 42
        type: integer
      page:
        example: 1
        type: integer
      per_page:
        example: 25
        type: integer
      total:
        example: 150
        type: integer
    type: object
  dto.PaginatedMailLogResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.MailLogEntryResponse'
        type: array
      filtered:
        example: 120
        type: integer
      page:
        example: 1
        type: integer
      per_page:
        example: 25
        type: integer
      total:
        example: 5000
        type: integer
    type: object
  dto.RBACAdminRoleResponse:
    properties:
      created:
        type: string
      domain:
        type: string
      id:
        type: integer
      role:
        $ref: '#/definitions/dto.RBACRoleResponse'
      role_id:
        type: integer
      username:
        type: string
    type: object
  dto.RBACPermissionResponse:
    properties:
      action:
        type: string
      id:
        type: integer
      name:
        type: string
      resource:
        type: string
    type: object
  dto.RBACRoleResponse:
    properties:
      created:
        type: string
      description:
        type: string
      id:
        type: integer
      modified:
        type: string
      name:
        type: string
      permissions:
        items:
          $ref: '#/definitions/dto.RBACPermissionResponse'
        type: array
      system:
        type: boolean
    type: object
  dto.RefreshResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      token_type:
        type: string
    type: object
  dto.TransportResponse:
    properties:
      active:
        example: true
        type: boolean
      created:
        type: string
      domain:
        example: example.com
        type: string
      id:
        example: 1
        type: integer
      modified:
        type: string
      transport:
        example: smtp:[relay.example.com]:25
        type: string
    type: object
  dto.UpdateAdminRequest:
    properties:
      active:
        type: boolean
      change_password:
        type: boolean
      domains:
        items:
          type: string
        type: array
      password:
        type: string
      password_confirm:
        type: string
      superadmin:
        type: boolean
    type: object
  dto.UpdateAliasDomainRequest:
    properties:
      active:
        example: false
        type: boolean
      target_domain:
        example: newexample.com
        type: string
    type: object
  dto.UpdateAliasRequest:
    properties:
      active:
        example: true
        type: boolean
      goto:
        example: admin@example.com
        type: string
    type: object
  dto.UpdateDomainRequest:
    properties:
      active:
        type: boolean
      aliases:
        type: integer
      backupmx:
        type: boolean
      description:
        type: string
      mailboxes:
        type: integer
      password_expiry:
        type: integer
      quota:
        type: integer
      transport:
        type: string
    type: object
  dto.UpdateForwardingRequest:
    properties:
      forwarding:
        example: |-
          john@example.com
          backup@example.com
        type: string
    type: object
  dto.UpdateMailboxRequest:
    properties:
      active:
        type: boolean
      change_password:
        type: boolean
      email_other:
        type: string
      name:
        type: string
      password:
        type: string
      password_confirm:
        type: string
      quota:
        type: integer
      smtp_active:
        type: boolean
    type: object
  dto.UpdatePasswordRequest:
    properties:
      confirm_password:
        example: NewPass456!
        type: string
      current_password:
        example: OldPass123!
        type: string
      new_password:
        example: NewPass456!
        type: string
    type: object
  dto.UpdateRoleRequest:
    properties:
      description:
        type: string
      permission_ids:
        items:
          type: integer
        type: array
    type: object
  dto.UpdateTransportRequest:
    properties:
      active:
        example: false
        type: boolean
      domain:
        example: example.com
        type: string
      transport:
        example: smtp:[relay.example.com]:587
        type: string
    type: object
  dto.UpdateVacationRequest:
    properties:
      active:
        example: true
        type: boolean
      activefrom:
        example: 2026-06-01T09:00
        type: string
      activeuntil:
        example: 2026-06-08T09:00
        type: string
      body:
        example: I am away until Friday.
        type: string
      interval_time:
        example: 86400
        type: integer
      subject:
        example: Out of Office
        type: string
    type: object
  dto.UserErrorResponse:
    properties:
      error:
        example: Current password is incorrect
        type: string
      success:
        example: false
        type: boolean
    type: object
  dto.UserForwardingResponse:
    properties:
      goto:
        example: john@example.com,backup@example.com
        type: string
    type: object
  dto.UserInfo:
    properties:
      domains:
        items:
          type: string
        type: array
      superadmin:
        type: boolean
      type:
        description: '"admin" or "mailbox"'
        type: string
      username:
        type: string
    type: object
  dto.UserProfileResponse:
    properties:
      name:
        example: John Doe
        type: string
      username:
        example: john@example.com
        type: string
    type: object
  dto.UserSuccessResponse:
    properties:
      message:
        example: Operation completed successfully
        type: string
      success:
        example: true
        type: boolean
    type: object
  dto.VacationResponse:
    properties:
      active:
        example: true
        type: boolean
      activefrom:
        example: 2026-06-01T09:00
        type: string
      activeuntil:
        example: 2026-06-08T09:00
        type: string
      body:
        example: I am away until Friday.
        type: string
      interval_time:
        example: 86400
        type: integer
      subject:
        example: Out of Office
        type: string
    type: object
  handlers.ApiKeyResponse:
    properties:
      active:
        type: boolean
      created:
        type: string
      expires_at:
        type: string
      id:
        type: integer
      name:
        type: string
      preview:
        description: masked version e.g. pfa_a1b2...****
        type: string
      token:
        description: populated ONLY on creation
        type: string
    type: object
  handlers.CreateApiKeyRequest:
    properties:
      days_valid:
        description: 0 = never expires
        example: 30
        type: integer
      name:
        example: External Integration Key
        type: string
    type: object
  handlers.UpdateApiKeyRequest:
    properties:
      active:
        example: false
        type: boolean
      name:
        example: Updated Key Name
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: jniltinho@gmail.com
    name: API Support
    url: https://github.com/jniltinho/go-postfixadmin
  description: Modern REST API for Go-PostfixAdmin with JWT authentication.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Go-PostfixAdmin API
  version: "1.0"
paths:
  /admins:
    get:
      description: Returns all administrators. Superadmins see all; regular admins
        see only themselves.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.AdminResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.APIResponse'
      security:
      - BearerAuth: []
      summary: List admins
      tags:
      - Admins
    post:
      consumes:
      - application/json
      description: Creates a new administrator. Only superadmins can call this endpoint.
        Supply domains[] to assign domain access (ignored for superadmins).
      parameters:
      - description: Admin data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAdminRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "403":
          description: Superadmin required
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "409":
          description: Admin already exists
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.APIResponse'
      security:
      - BearerAuth: []
      summary: Create admin
      tags:
      - Admins
  /admins/{username}:
    delete:
      description: Permanently deletes an administrator. Only superadmins can call
        this endpoint.
      parameters:
      - description: Admin username (e.g. admin@example.com)
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "403":
          description: Superadmin required
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete admin
      tags:
      - Admins
    get:
      description: Returns details for a single administrator plus the full list of
        domains with assignment flags. Non-superadmins can only view themselves.
      parameters:
      - description: Admin username (e.g. admin@example.com)
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AdminDetailResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.APIResponse'
      security:
      - BearerAuth: []
      summary: Get admin
      tags:
      - Admins
    put:
      consumes:
      - application/json
      description: Updates an existing administrator. Superadmins can change active/superadmin
        flags and domain assignments. Any admin can change their own password via
        change_password=true.
      parameters:
      - description: Admin username (e.g. admin@example.com)
        in: path
        name: username
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateAdminRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.APIResponse'
      security:
      - BearerAuth: []
      summary: Update admin
      tags:
      - Admins
  /alias-domains:
    get:
      description: Returns all alias domains. Superadmins see all; domain admins see
        only those where target_domain is in their scope.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.AliasDomainResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.APIResponse'
      security:
      - BearerAuth: []
      summary: List alias domains
      tags:
      - Alias Domains
    post:
      consumes:
      - application/json
      description: Creates an alias domain that redirects all mail to a target domain.
        Both alias_domain and target_domain must differ; target_domain must already
        exist.
      parameters:
      - description: Alias domain data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAliasDomainRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "409":
          description: Alias domain already exists
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.APIResponse'
      security:
      - BearerAuth: []
      summary: Create alias domain
      tags:
      - Alias Domains
  /alias-domains/{alias_domain}:
    delete:
      description: Permanently deletes an alias domain. The caller must have admin
        access to the target domain.
      parameters:
      - description: Alias domain name (e.g. alias.com)
        in: path
        name: alias_domain
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete alias domain
      tags:
      - Alias Domains
    get:
      description: Returns details for a single alias domain. The caller must have
        admin access to the target domain.
      parameters:
      - description: Alias domain name (e.g. alias.com)
        in: path
        name: alias_domain
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AliasDomainResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.APIResponse'
      security:
      - BearerAuth: []
      summary: Get alias domain
      tags:
      - Alias Domains
    put:
      consumes:
      - application/json
      description: Updates the target domain and/or active state of an existing alias
        domain. All fields are optional.
      parameters:
      - description: Alias domain name (e.g. alias.com)
        in: path
        name: alias_domain
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateAliasDomainRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.APIResponse'
      security:
      - BearerAuth: []
      summary: Update alias domain
      tags:
      - Alias Domains
  /aliases:
    get:
      description: Returns all aliases accessible to the authenticated admin. Superadmins
        see all; domain admins see only their domains. Use ?domain= to filter by domain.
      parameters:
      - description: Filter by domain
        in: query
        name: domain
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.AliasResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.APIResponse'
      security:
      - BearerAuth: []
      summary: List aliases
      tags:
      - Aliases
    post:
