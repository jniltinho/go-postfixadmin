basePath: /api/v1
definitions:
  dto.APIError:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  dto.APIResponse:
    properties:
      data: {}
      error:
        $ref: '#/definitions/dto.APIError'
      success:
        type: boolean
    type: object
  dto.CreateDomainRequest:
    properties:
      active:
        type: boolean
      aliases:
        type: integer
      backupmx:
        type: boolean
      description:
        type: string
      domain:
        type: string
      mailboxes:
        type: integer
      password_expiry:
        type: integer
      quota:
        type: integer
      transport:
        type: string
    type: object
  dto.DashboardStatsResponse:
    properties:
      aliases:
        type: integer
      domains:
        type: integer
      mailboxes:
        type: integer
      recent_logs:
        items:
          $ref: '#/definitions/dto.LogEntryResponse'
        type: array
    type: object
  dto.DomainResponse:
    properties:
      active:
        type: boolean
      alias_count:
        description: Optional enrichment
        type: integer
      aliases:
        type: integer
      backupmx:
        type: boolean
      created:
        type: string
      description:
        type: string
      domain:
        type: string
      mailbox_count:
        type: integer
      mailboxes:
        type: integer
      maxquota:
        type: integer
      modified:
        type: string
      password_expiry:
        type: integer
      quota:
        type: integer
      transport:
        type: string
    type: object
  dto.LogEntryResponse:
    properties:
      action:
        type: string
      data:
        type: string
      domain:
        type: string
      timestamp:
        type: string
      username:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  dto.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      token_type:
        type: string
      user:
        $ref: '#/definitions/dto.UserInfo'
    type: object
  dto.RefreshResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      token_type:
        type: string
    type: object
  dto.UpdateForwardingRequest:
    properties:
      forwarding:
        example: |-
          john@example.com
          backup@example.com
        type: string
    type: object
  dto.UpdatePasswordRequest:
    properties:
      confirm_password:
        example: NewPass456!
        type: string
      current_password:
        example: OldPass123!
        type: string
      new_password:
        example: NewPass456!
        type: string
    type: object
  dto.UpdateVacationRequest:
    properties:
      active:
        example: true
        type: boolean
      activefrom:
        example: 2026-06-01T09:00
        type: string
      activeuntil:
        example: 2026-06-08T09:00
        type: string
      body:
        example: I am away until Friday.
        type: string
      interval_time:
        example: 86400
        type: integer
      subject:
        example: Out of Office
        type: string
    type: object
  dto.UserErrorResponse:
    properties:
      error:
        example: Current password is incorrect
        type: string
      success:
        example: false
        type: boolean
    type: object
  dto.UserForwardingResponse:
    properties:
      goto:
        example: john@example.com,backup@example.com
        type: string
    type: object
  dto.UserInfo:
    properties:
      domains:
        items:
          type: string
        type: array
      superadmin:
        type: boolean
      type:
        description: '"admin" or "mailbox"'
        type: string
      username:
        type: string
    type: object
  dto.UserProfileResponse:
    properties:
      name:
        example: John Doe
        type: string
      username:
        example: john@example.com
        type: string
    type: object
  dto.UserSuccessResponse:
    properties:
      message:
        example: Operation completed successfully
        type: string
      success:
        example: true
        type: boolean
    type: object
  dto.VacationResponse:
    properties:
      active:
        example: true
        type: boolean
      activefrom:
        example: 2026-06-01T09:00
        type: string
      activeuntil:
        example: 2026-06-08T09:00
        type: string
      body:
        example: I am away until Friday.
        type: string
      interval_time:
        example: 86400
        type: integer
      subject:
        example: Out of Office
        type: string
    type: object
  handlers.ApiKeyResponse:
    properties:
      active:
        type: boolean
      created:
        type: string
      expires_at:
        type: string
      id:
        type: integer
      name:
        type: string
      preview:
        description: masked version e.g. pfa_a1b2...****
        type: string
      token:
        description: populated ONLY on creation
        type: string
    type: object
  handlers.CreateApiKeyRequest:
    properties:
      days_valid:
        description: 0 = never expires
        example: 30
        type: integer
      name:
        example: External Integration Key
        type: string
    type: object
  handlers.UpdateApiKeyRequest:
    properties:
      active:
        example: false
        type: boolean
      name:
        example: Updated Key Name
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: jniltinho@gmail.com
    name: API Support
    url: https://github.com/jniltinho/go-postfixadmin
  description: Modern REST API for Go-PostfixAdmin with JWT authentication.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Go-PostfixAdmin API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates as Admin or Mailbox user. Returns JWT access token
        in body and sets httpOnly refresh cookie.
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "429":
          description: Too many requests
          schema:
            $ref: '#/definitions/dto.APIResponse'
      summary: Login
      tags:
      - Authentication
  /auth/logout:
    post:
      description: Clears the httpOnly refresh token cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.APIResponse'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - Authentication
  /auth/me:
    get:
      description: Returns information about the logged-in user extracted from the
        JWT.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserInfo'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.APIResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - Authentication
  /auth/refresh:
    post:
      description: Uses the httpOnly refresh cookie to issue a new access token (with
        rotation).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.RefreshResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.APIResponse'
      security:
      - BearerAuth: []
      summary: Refresh token
      tags:
      - Authentication
  /dashboard:
    get:
      description: Returns aggregate counts and recent activity for the authenticated
        user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DashboardStatsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.APIResponse'
      security:
      - BearerAuth: []
      summary: Dashboard statistics
      tags:
      - Dashboard
  /domains:
    get:
      description: Returns all domains the authenticated user has access to (based
        on JWT claims).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.DomainResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.APIResponse'
      security:
      - BearerAuth: []
      summary: List domains
      tags:
      - Domains
    post:
      consumes:
      - application/json
      description: Creates a new domain (only superadmins can create).
      parameters:
      - description: Domain data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateDomainRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.APIResponse'
      security:
      - BearerAuth: []
      summary: Create domain
      tags:
      - Domains
  /domains/{domain}:
    delete:
      description: Deletes a domain and all related data (only superadmins).
      parameters:
      - description: Domain name
        in: path
        name: domain
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete domain
      tags:
      - Domains
    get:
      description: Returns details of a specific domain (respects user scoping).
      parameters:
      - description: Domain name
        in: path
        name: domain
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.DomainResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.APIResponse'
      security:
      - BearerAuth: []
      summary: Get domain
      tags:
      - Domains
  /settings/apikeys:
    get:
      description: Retrieves all API keys for the current authenticated administrator.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.ApiKeyResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.APIResponse'
      security:
      - BearerAuth: []
      summary: List API Keys
      tags:
      - Settings
    post:
      consumes:
      - application/json
      description: Creates a new API key and returns the raw secret token once. Keep
        this token safe as it cannot be recovered.
      parameters:
      - description: API Key Settings
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateApiKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ApiKeyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.APIResponse'
      security:
      - BearerAuth: []
      summary: Create API Key
      tags:
      - Settings
  /settings/apikeys/{id}:
    delete:
      description: Revokes and permanently deletes a specific API key.
      parameters:
      - description: API Key ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete API Key
      tags:
      - Settings
    put:
      consumes:
      - application/json
      description: Renames or changes active/disabled status of a specific API key.
      parameters:
      - description: API Key ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update settings
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateApiKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.APIResponse'
      security:
      - BearerAuth: []
      summary: Update API Key
      tags:
      - Settings
  /user/forwarding:
    get:
      description: Returns the current comma-separated forwarding destinations for
        the authenticated mailbox.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserForwardingResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.UserErrorResponse'
      security:
      - BearerAuth: []
      summary: Get forwarding addresses
      tags:
      - User Portal
    post:
      consumes:
      - application/json
      description: Sets the email forwarding destinations. Send one address per line;
        leave blank to reset to self-delivery.
      parameters:
      - description: Forwarding configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateForwardingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.UserErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.UserErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.UserErrorResponse'
      security:
      - BearerAuth: []
      summary: Update forwarding addresses
      tags:
      - User Portal
  /user/me:
    get:
      description: Returns the display name and email address of the authenticated
        mailbox user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserProfileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.UserErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.UserErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user profile info
      tags:
      - User Portal
  /user/password:
    post:
      consumes:
      - application/json
      description: Allows the authenticated mailbox user to change their own password.
        The current password must be provided for verification.
      parameters:
      - description: Password change payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdatePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserSuccessResponse'
        "400":
          description: Wrong current password, validation error, or passwords do not
            match
          schema:
            $ref: '#/definitions/dto.UserErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.UserErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.UserErrorResponse'
      security:
      - BearerAuth: []
      summary: Change mailbox password
      tags:
      - User Portal
  /user/vacation:
    delete:
      description: Deletes the vacation (out-of-office) configuration for the authenticated
        mailbox.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserSuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.UserErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.UserErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove auto-reply settings
      tags:
      - User Portal
    get:
      description: Returns the current vacation (out-of-office) configuration for
        the authenticated mailbox. Returns defaults when no vacation is configured.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.VacationResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.UserErrorResponse'
      security:
      - BearerAuth: []
      summary: Get auto-reply / vacation settings
      tags:
      - User Portal
    post:
      consumes:
      - application/json
      description: Creates or updates the vacation (out-of-office) configuration.
        Date fields use format "2006-01-02T15:04". interval_time is in seconds (0
        = send once per sender).
      parameters:
      - description: Vacation configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateVacationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.UserErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.UserErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.UserErrorResponse'
      security:
      - BearerAuth: []
      summary: Save auto-reply / vacation settings
      tags:
      - User Portal
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
