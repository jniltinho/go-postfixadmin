{{define "form_edit_alias"}}
<!-- Edit Alias Modal -->
<div id="editAliasModal" class="fixed inset-0 z-50 hidden">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/50" onclick="closeEditAliasModal()"></div>
    <!-- Modal Box -->
    <div class="relative z-10 flex items-center justify-center min-h-screen p-4">
        <div class="bg-white border-4 border-brand-text w-full max-w-2xl max-h-[90vh] flex flex-col">
            <!-- Header -->
            <div class="bg-brand-primary px-6 py-4 flex items-center justify-between flex-shrink-0">
                <h3 class="text-lg font-mono font-black uppercase tracking-tight text-white flex items-center">
                    <i data-lucide="edit" class="w-5 h-5 mr-2"></i>
                    {{ T $.Lang `Aliases_EditTitle` }} <span id="modal-edit-alias-title-suffix" class="ml-2 text-gray-200"></span>
                </h3>
                <button onclick="closeEditAliasModal()" class="text-white hover:text-gray-200 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Scrollable Body -->
            <div class="overflow-y-auto flex-1 relative">
                <!-- Loading State -->
                <div id="modal-edit-alias-loading" class="absolute inset-0 bg-white/80 z-20 flex items-center justify-center hidden">
                    <div class="flex flex-col items-center">
                        <i data-lucide="loader-2" class="w-8 h-8 text-brand-primary animate-spin mb-2"></i>
                        <span class="text-sm font-bold uppercase tracking-widest text-brand-text">Loading...</span>
                    </div>
                </div>

                <!-- Error Area -->
                <div id="modal-edit-alias-error"
                    class="hidden mx-6 mt-4 bg-red-50 border-2 border-red-600 p-3 flex items-start">
                    <i data-lucide="alert-circle" class="w-4 h-4 text-red-600 mr-2 mt-0.5 flex-shrink-0"></i>
                    <p id="modal-edit-alias-error-text" class="text-sm text-red-700 font-medium"></p>
                </div>

                <form id="modalEditAliasForm" class="p-6 space-y-5 hidden">
                    <input type="hidden" id="modal-edit-alias-id" name="address_id">

                    <!-- Basic Information Card -->
                    <div class="border-2 border-brand-text p-4 space-y-4">
                        <h4 class="text-sm font-mono font-black uppercase tracking-tight flex items-center">
                            <i data-lucide="info" class="w-4 h-4 mr-2"></i>
                            {{ T $.Lang `Aliases_InfoTitle` }}
                        </h4>

                        <!-- Address (Read-only) -->
                        <div>
                            <label class="block text-xs font-black uppercase tracking-widest text-brand-text mb-1">
                                {{ T $.Lang `Aliases_LblAliasAddress` }}
                            </label>
                            <input type="text" id="modal-edit-address" readonly
                                class="w-full h-10 px-3 border-2 border-gray-300 bg-gray-50 font-medium font-mono text-sm cursor-not-allowed">
                            <p class="text-[10px] text-gray-500 mt-1">
                                {{ T $.Lang `Aliases_HelpAddressEdit` }}
                            </p>
                        </div>

                        <!-- Goto (To) -->
                        <div>
                            <label for="modal-edit-goto" class="block text-xs font-black uppercase tracking-widest text-brand-text mb-1">
                                {{ T $.Lang `Aliases_LblTo` }} <span class="text-red-500">*</span>
                            </label>
                            <textarea id="modal-edit-goto" name="goto" rows="4" required placeholder="{{ T $.Lang `Aliases_PhTo` }}"
                                class="w-full px-3 py-2 border-2 border-brand-text focus:border-brand-primary focus:outline-none font-medium transition-colors resize-y text-sm"></textarea>
                            <p class="text-[10px] text-gray-500 mt-1">
                                {{ T $.Lang `Aliases_HelpToEdit` }}
                            </p>
                        </div>

                        <!-- Active Toggle -->
                        <div class="flex items-center pt-2">
                            <input type="checkbox" id="modal-edit-active" name="active" value="true"
                                class="w-5 h-5 border-2 border-brand-text cursor-pointer">
                            <label for="modal-edit-active" class="ml-2 text-sm font-bold cursor-pointer">
                                {{ T $.Lang `Aliases_LblActive` }}
                            </label>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Footer / Actions -->
            <div
                class="bg-gray-50 px-6 py-4 flex items-center justify-end space-x-3 border-t-2 border-brand-text flex-shrink-0">
                <button type="button" onclick="closeEditAliasModal()"
                    class="bg-white hover:bg-gray-100 text-brand-text border-2 border-brand-text font-black px-6 py-2.5 shadow-[2px_2px_0px_#1E293B] hover:translate-y-px hover:shadow-[1px_1px_0px_#1E293B] active:translate-y-0.5 active:shadow-none transition-all uppercase tracking-widest text-sm flex items-center">
                    <i data-lucide="x" class="w-4 h-4 mr-2"></i>
                    {{ T $.Lang `Aliases_BtnCancel` }}
                </button>
                <button type="submit" form="modalEditAliasForm" id="btn-update-alias"
                    class="bg-brand-primary hover:bg-white hover:text-brand-primary text-white border-2 border-brand-text font-black px-6 py-2.5 shadow-[2px_2px_0px_#1E293B] hover:translate-y-px hover:shadow-[1px_1px_0px_#1E293B] active:translate-y-0.5 active:shadow-none transition-all uppercase tracking-widest text-sm flex items-center">
                    <i data-lucide="check" class="w-4 h-4 mr-2"></i>
                    {{ T $.Lang `Aliases_BtnSave` }}
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    function openEditAliasModal(address) {
        document.getElementById('editAliasModal').classList.remove('hidden');
        document.getElementById('modal-edit-alias-error').classList.add('hidden');
        document.getElementById('modalEditAliasForm').classList.add('hidden');
        document.getElementById('modal-edit-alias-loading').classList.remove('hidden');
        
        document.getElementById('modal-edit-alias-title-suffix').textContent = '- ' + address;
        lucide.createIcons();

        fetch('/api/aliases/' + encodeURIComponent(address))
            .then(function(res) {
                if (!res.ok) throw new Error('Failed to load data');
                return res.json();
            })
            .then(function(data) {
                if (data.error) throw new Error(data.error);
                
                document.getElementById('modal-edit-alias-id').value = data.alias.Address;
                document.getElementById('modal-edit-address').value = data.alias.Address;
                document.getElementById('modal-edit-goto').value = data.alias.Goto;
                document.getElementById('modal-edit-active').checked = data.alias.Active;

                document.getElementById('modal-edit-alias-loading').classList.add('hidden');
                document.getElementById('modalEditAliasForm').classList.remove('hidden');
                
                var btn = document.getElementById('btn-update-alias');
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            })
            .catch(function(err) {
                document.getElementById('modal-edit-alias-loading').classList.add('hidden');
                var errBox = document.getElementById('modal-edit-alias-error');
                document.getElementById('modal-edit-alias-error-text').textContent = err.message || 'Error occurred';
                errBox.classList.remove('hidden');
            });
    }

    function closeEditAliasModal() {
        document.getElementById('editAliasModal').classList.add('hidden');
    }

    document.getElementById('modalEditAliasForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var form = this;
        var btn = document.getElementById('btn-update-alias');
        var errBox = document.getElementById('modal-edit-alias-error');
        var errText = document.getElementById('modal-edit-alias-error-text');
        var addressId = document.getElementById('modal-edit-alias-id').value;

        errBox.classList.add('hidden');
        btn.disabled = true;
        btn.classList.add('opacity-50', 'cursor-not-allowed');

        var formData = new FormData(form);
        
        fetch('/api/aliases/' + encodeURIComponent(addressId), {
            method: 'POST',
            body: formData,
            headers: { 'Accept': 'application/json' }
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            if (data.success) {
                window.location.reload();
            } else {
                errText.textContent = data.error || 'Failed to update alias';
                errBox.classList.remove('hidden');
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        })
        .catch(function(err) {
            errText.textContent = 'Network or server error occurred.';
            errBox.classList.remove('hidden');
            btn.disabled = false;
            btn.classList.remove('opacity-50', 'cursor-not-allowed');
            console.error('Update alias error:', err);
        });
    });
</script>
{{end}}
