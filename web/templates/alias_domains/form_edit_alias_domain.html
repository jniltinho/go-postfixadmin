{{define "form_edit_alias_domain"}}
<!-- Edit Alias Domain Modal -->
<div id="editAliasDomainModal" class="fixed inset-0 z-50 hidden">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/50" onclick="closeEditAliasDomainModal()"></div>
    <!-- Modal Box -->
    <div class="relative z-10 flex items-center justify-center min-h-screen p-4">
        <div class="bg-white border-4 border-brand-text w-full max-w-2xl max-h-[90vh] flex flex-col">
            <!-- Header -->
            <div class="bg-brand-primary px-6 py-4 flex items-center justify-between flex-shrink-0">
                <h3 class="text-lg font-mono font-black uppercase tracking-tight text-white flex items-center">
                    <i data-lucide="edit" class="w-5 h-5 mr-2"></i>
                    {{ T $.Lang `AliasDomains_EditTitle` }} <span id="modal-edit-aliasdomain-title-suffix" class="ml-2 text-gray-200"></span>
                </h3>
                <button onclick="closeEditAliasDomainModal()" class="text-white hover:text-gray-200 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Scrollable Body -->
            <div class="overflow-y-auto flex-1 relative">
                <!-- Loading State -->
                <div id="modal-edit-aliasdomain-loading" class="absolute inset-0 bg-white/80 z-20 flex items-center justify-center hidden">
                    <div class="flex flex-col items-center">
                        <i data-lucide="loader-2" class="w-8 h-8 text-brand-primary animate-spin mb-2"></i>
                        <span class="text-sm font-bold uppercase tracking-widest text-brand-text">Loading...</span>
                    </div>
                </div>

                <!-- Error Area -->
                <div id="modal-edit-aliasdomain-error"
                    class="hidden mx-6 mt-4 bg-red-50 border-2 border-red-600 p-3 flex items-start">
                    <i data-lucide="alert-circle" class="w-4 h-4 text-red-600 mr-2 mt-0.5 flex-shrink-0"></i>
                    <p id="modal-edit-aliasdomain-error-text" class="text-sm text-red-700 font-medium"></p>
                </div>

                <form id="modalEditAliasDomainForm" class="p-6 space-y-5 hidden">
                    <input type="hidden" id="modal-edit-aliasdomain-id" name="alias_domain_id">

                    <!-- Basic Information Card -->
                    <div class="border-2 border-brand-text p-4 space-y-4">
                        <h4 class="text-sm font-mono font-black uppercase tracking-tight flex items-center">
                            <i data-lucide="info" class="w-4 h-4 mr-2"></i>
                            {{ T $.Lang `AliasDomains_InfoTitle` }}
                        </h4>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-start">
                            <!-- Alias Domain (Read Only) -->
                            <div>
                                <label class="block text-xs font-black uppercase tracking-widest text-brand-text mb-1">
                                    {{ T $.Lang `AliasDomains_LblAliasDomain` }}
                                </label>
                                <input type="text" id="modal-edit-alias_domain" readonly
                                    class="w-full h-10 px-3 border-2 border-gray-300 bg-gray-50 font-medium font-mono text-sm cursor-not-allowed">
                                <p class="text-[10px] text-gray-500 mt-1">
                                    {{ T $.Lang `AliasDomains_HelpAliasDomainEdit` }}
                                </p>
                            </div>

                            <!-- Target Domain -->
                            <div>
                                <label for="modal-edit-target_domain" class="block text-xs font-black uppercase tracking-widest text-brand-text mb-1">
                                    {{ T $.Lang `AliasDomains_LblTargetDomain` }} <span class="text-red-500">*</span>
                                </label>
                                <select id="modal-edit-target_domain" name="target_domain" required
                                    class="w-full h-10 px-3 border-2 border-brand-text focus:border-brand-primary focus:outline-none font-medium transition-colors bg-white cursor-pointer text-sm">
                                    <!-- Options generated by JS -->
                                </select>
                                <p class="text-[10px] text-gray-500 mt-1">
                                    {{ T $.Lang `AliasDomains_HelpTargetDomain` }}
                                </p>
                            </div>
                        </div>

                        <!-- Active Toggle -->
                        <div class="flex items-center pt-2">
                            <input type="checkbox" id="modal-edit-active" name="active" value="true"
                                class="w-5 h-5 border-2 border-brand-text cursor-pointer">
                            <label for="modal-edit-active" class="ml-2 text-sm font-bold cursor-pointer">
                                {{ T $.Lang `AliasDomains_LblActive` }}
                            </label>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Footer / Actions -->
            <div
                class="bg-gray-50 px-6 py-4 flex items-center justify-end space-x-3 border-t-2 border-brand-text flex-shrink-0">
                <button type="button" onclick="closeEditAliasDomainModal()"
                    class="bg-white hover:bg-gray-100 text-brand-text border-2 border-brand-text font-black px-6 py-2.5 shadow-[2px_2px_0px_#1E293B] hover:translate-y-px hover:shadow-[1px_1px_0px_#1E293B] active:translate-y-0.5 active:shadow-none transition-all uppercase tracking-widest text-sm flex items-center">
                    <i data-lucide="x" class="w-4 h-4 mr-2"></i>
                    {{ T $.Lang `AliasDomains_BtnCancel` }}
                </button>
                <button type="submit" form="modalEditAliasDomainForm" id="btn-update-aliasdomain"
                    class="bg-brand-primary hover:bg-white hover:text-brand-primary text-white border-2 border-brand-text font-black px-6 py-2.5 shadow-[2px_2px_0px_#1E293B] hover:translate-y-px hover:shadow-[1px_1px_0px_#1E293B] active:translate-y-0.5 active:shadow-none transition-all uppercase tracking-widest text-sm flex items-center">
                    <i data-lucide="check" class="w-4 h-4 mr-2"></i>
                    {{ T $.Lang `AliasDomains_BtnSave` }}
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    function openEditAliasDomainModal(aliasDomain) {
        document.getElementById('editAliasDomainModal').classList.remove('hidden');
        document.getElementById('modal-edit-aliasdomain-error').classList.add('hidden');
        document.getElementById('modalEditAliasDomainForm').classList.add('hidden');
        document.getElementById('modal-edit-aliasdomain-loading').classList.remove('hidden');
        
        document.getElementById('modal-edit-aliasdomain-title-suffix').textContent = '- ' + aliasDomain;
        lucide.createIcons();

        fetch('/api/alias-domains/' + encodeURIComponent(aliasDomain))
            .then(function(res) {
                if (!res.ok) throw new Error('Failed to load data');
                return res.json();
            })
            .then(function(data) {
                if (data.error) throw new Error(data.error);
                
                document.getElementById('modal-edit-aliasdomain-id').value = data.alias_domain.AliasDomain;
                document.getElementById('modal-edit-alias_domain').value = data.alias_domain.AliasDomain;
                document.getElementById('modal-edit-active').checked = data.alias_domain.Active;

                var selectTgt = document.getElementById('modal-edit-target_domain');
                selectTgt.innerHTML = '<option value="" disabled>{{ T $.Lang `AliasDomains_PhSelectTarget` }}</option>';
                
                data.domains.forEach(function(d) {
                    var option = document.createElement('option');
                    option.value = d.Domain;
                    option.textContent = d.Domain;
                    if (d.Domain === data.alias_domain.TargetDomain) {
                        option.selected = true;
                    }
                    selectTgt.appendChild(option);
                });

                document.getElementById('modal-edit-aliasdomain-loading').classList.add('hidden');
                document.getElementById('modalEditAliasDomainForm').classList.remove('hidden');
                
                var btn = document.getElementById('btn-update-aliasdomain');
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            })
            .catch(function(err) {
                document.getElementById('modal-edit-aliasdomain-loading').classList.add('hidden');
                var errBox = document.getElementById('modal-edit-aliasdomain-error');
                document.getElementById('modal-edit-aliasdomain-error-text').textContent = err.message || 'Error occurred';
                errBox.classList.remove('hidden');
            });
    }

    function closeEditAliasDomainModal() {
        document.getElementById('editAliasDomainModal').classList.add('hidden');
    }

    document.getElementById('modalEditAliasDomainForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var form = this;
        var btn = document.getElementById('btn-update-aliasdomain');
        var errBox = document.getElementById('modal-edit-aliasdomain-error');
        var errText = document.getElementById('modal-edit-aliasdomain-error-text');
        var aliasDomainId = document.getElementById('modal-edit-aliasdomain-id').value;

        errBox.classList.add('hidden');
        btn.disabled = true;
        btn.classList.add('opacity-50', 'cursor-not-allowed');

        var formData = new FormData(form);
        
        fetch('/api/alias-domains/' + encodeURIComponent(aliasDomainId), {
            method: 'POST',
            body: formData,
            headers: { 'Accept': 'application/json' }
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            if (data.success) {
                window.location.reload();
            } else {
                errText.textContent = data.error || 'Failed to update alias domain';
                errBox.classList.remove('hidden');
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        })
        .catch(function(err) {
            errText.textContent = 'Network or server error occurred.';
            errBox.classList.remove('hidden');
            btn.disabled = false;
            btn.classList.remove('opacity-50', 'cursor-not-allowed');
            console.error('Update alias domain error:', err);
        });
    });
</script>
{{end}}
