{{define "form_add_transport"}}
<!-- Add Transport Modal -->
<div id="addTransportModal" class="fixed inset-0 z-50 hidden">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/50" onclick="closeAddTransportModal()"></div>
    <!-- Modal Box -->
    <div class="relative z-10 flex items-center justify-center min-h-screen p-4">
        <div class="bg-white border-4 border-brand-text w-full max-w-lg max-h-[90vh] flex flex-col">
            <!-- Header -->
            <div class="bg-brand-primary px-6 py-4 flex items-center justify-between flex-shrink-0">
                <h3 class="text-lg font-mono font-black uppercase tracking-tight text-white flex items-center">
                    <i data-lucide="plus-circle" class="w-5 h-5 mr-2"></i>
                    {{ T $.Lang `Transport_AddTitle` }}
                </h3>
                <button onclick="closeAddTransportModal()" class="text-white hover:text-gray-200 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Scrollable Body -->
            <div class="overflow-y-auto flex-1">
                <!-- Error Area -->
                <div id="modal-add-transport-error"
                    class="hidden mx-6 mt-4 bg-red-50 border-2 border-red-600 p-3 flex items-start">
                    <i data-lucide="alert-circle" class="w-4 h-4 text-red-600 mr-2 mt-0.5 flex-shrink-0"></i>
                    <p id="modal-add-transport-error-text" class="text-sm text-red-700 font-medium"></p>
                </div>

                <form id="modalAddTransportForm" class="p-6 space-y-5">
                    <div class="border-2 border-brand-text p-4 space-y-4">
                        <!-- Domain Name -->
                        <div>
                            <label for="modal-add-domain"
                                class="block text-xs font-black uppercase tracking-widest text-brand-text mb-1">
                                {{ T $.Lang `Transport_LblDomain` }} <span class="text-red-500">*</span>
                            </label>
                            <input type="text" id="modal-add-domain" name="domain" required
                                placeholder="{{ T $.Lang `Transport_PhDomain` }}"
                                class="w-full h-10 px-3 border-2 border-brand-text focus:border-brand-primary focus:outline-none font-medium transition-colors text-sm">
                        </div>

                        <!-- Transport Name -->
                        <div>
                            <label for="modal-add-transport"
                                class="block text-xs font-black uppercase tracking-widest text-brand-text mb-1">
                                {{ T $.Lang `Transport_LblTransport` }} <span class="text-red-500">*</span>
                            </label>
                            <input type="text" id="modal-add-transport" name="transport" required
                                placeholder="{{ T $.Lang `Transport_PhTransport` }}"
                                class="w-full h-10 px-3 border-2 border-brand-text focus:border-brand-primary focus:outline-none font-medium transition-colors text-sm">
                        </div>

                        <!-- Active -->
                        <div class="flex items-center pt-2">
                            <input type="checkbox" id="modal-add-transport-active" name="active" value="true" checked
                                class="w-5 h-5 border-2 border-brand-text cursor-pointer">
                            <label for="modal-add-transport-active" class="ml-2 text-sm font-bold cursor-pointer">
                                {{ T $.Lang `Transport_LblActive` }}
                            </label>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Footer / Actions -->
            <div
                class="bg-gray-50 px-6 py-4 flex items-center justify-end space-x-3 border-t-2 border-brand-text flex-shrink-0">
                <button type="button" onclick="closeAddTransportModal()"
                    class="bg-white hover:bg-gray-100 text-brand-text border-2 border-brand-text font-black px-6 py-2.5 shadow-[2px_2px_0px_#1E293B] hover:translate-y-px hover:shadow-[1px_1px_0px_#1E293B] active:translate-y-0.5 active:shadow-none transition-all uppercase tracking-widest text-sm flex items-center">
                    <i data-lucide="x" class="w-4 h-4 mr-2"></i>
                    {{ T $.Lang `Transport_BtnCancel` }}
                </button>
                <button type="submit" form="modalAddTransportForm" id="btn-save-transport"
                    class="bg-brand-primary hover:bg-white hover:text-brand-primary text-white border-2 border-brand-text font-black px-6 py-2.5 shadow-[2px_2px_0px_#1E293B] hover:translate-y-px hover:shadow-[1px_1px_0px_#1E293B] active:translate-y-0.5 active:shadow-none transition-all uppercase tracking-widest text-sm flex items-center">
                    <i data-lucide="save" class="w-4 h-4 mr-2"></i>
                    {{ T $.Lang `Transport_BtnSave` }}
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    function openAddTransportModal() {
        document.getElementById('addTransportModal').classList.remove('hidden');
        document.getElementById('modal-add-transport-error').classList.add('hidden');
        document.getElementById('modalAddTransportForm').reset();
        lucide.createIcons();
    }

    function closeAddTransportModal() {
        document.getElementById('addTransportModal').classList.add('hidden');
    }

    document.getElementById('modalAddTransportForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var form = this;
        var btn = document.getElementById('btn-save-transport');
        var errBox = document.getElementById('modal-add-transport-error');
        var errText = document.getElementById('modal-add-transport-error-text');

        errBox.classList.add('hidden');

        if (!document.getElementById('modal-add-domain').value.trim()) {
            errText.textContent = `{{ T $.Lang "Transport_JsDomainRequired" }}`;
            errBox.classList.remove('hidden');
            return;
        }

        if (!document.getElementById('modal-add-transport').value.trim()) {
            errText.textContent = `{{ T $.Lang "Transport_JsTransportRequired" }}`;
            errBox.classList.remove('hidden');
            return;
        }

        btn.disabled = true;
        btn.classList.add('opacity-50', 'cursor-not-allowed');

        var formData = new FormData(form);

        fetch('/api/transports', {
            method: 'POST',
            body: formData,
            headers: { 'Accept': 'application/json' }
        })
            .then(function (res) { return res.json(); })
            .then(function (data) {
                if (data.success) {
                    window.location.reload();
                } else {
                    errText.textContent = data.error || `{{ T $.Lang "Transport_JsCreateFailed" }}`;
                    errBox.classList.remove('hidden');
                    btn.disabled = false;
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            })
            .catch(function (err) {
                errText.textContent = `{{ T $.Lang "Transport_JsNetworkError" }}`;
                errBox.classList.remove('hidden');
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            });
    });
</script>
{{end}}
